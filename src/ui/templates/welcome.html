  <!-- Explicit choice on a fresh session. Live feeds are not auto-enabled until
       the visitor asks; shared links skip this surface entirely. It returns
       every session until "Don't show this again" is ticked — see
       src/firstRunExperience.js for the full show policy. The copy comes from
       EDITION.firstRun so the dialog reads as this edition, not upstream's. -->
  <aside id="first-run-launcher" role="dialog" aria-labelledby="first-run-title" aria-describedby="first-run-description" hidden>
    <header class="first-run-header">
      <span class="first-run-kicker" translate="no"><span lang="hi">धुआँ</span> Dhuan</span>
    </header>
    <h2 id="first-run-title" data-i18n>Watch India's smog season as it happens</h2>
    <p id="first-run-description" data-i18n-runtime>Stubble fires in Punjab, the wind that carries the smoke, and the air Delhi breathes. Every number comes from a public feed.</p>
    <div class="first-run-choices">
      <button type="button" data-first-run-choice="smog">
        <span class="material-symbols-outlined" aria-hidden="true">local_fire_department</span>
        <span><strong data-i18n>Smog season live</strong><small data-i18n>Active fires, CPCB air quality and wind over Punjab and Delhi</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
      <button type="button" class="first-run-explore" data-first-run-choice="explore">
        <span class="material-symbols-outlined" aria-hidden="true">public</span>
        <span><strong data-i18n>Explore the map</strong><small data-i18n>Begin with a clean globe</small></span>
        <span class="material-symbols-outlined first-run-arrow" aria-hidden="true">arrow_forward</span>
      </button>
    </div>
    <div class="first-run-footer">
      <label class="first-run-suppress">
        <input type="checkbox" data-first-run-suppress />
        <span data-i18n>Don't show this again</span>
      </label>
      <span data-i18n>ESC to dismiss</span>
    </div>
    <!-- Kept out of the footer row: it swaps to mission progress and errors, and
         a live region that also holds layout makes the row jump as it speaks. -->
    <p class="first-run-note" data-first-run-status role="status" aria-live="polite" data-i18n>Tip: turn layers on and off from the panel on the left.</p>
  </aside>
